services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: vernacular
      POSTGRES_USER: vernacular
      POSTGRES_PASSWORD: vernacular
    ports:
      - "5432:5432"
    volumes:
      - vernacular_pgdata:/var/lib/postgresql/data
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      DATABASE_URL: postgresql://vernacular:vernacular@postgres:5432/vernacular
      PORT: 5000
    depends_on:
      - postgres
    ports:
      - "5000:5000"
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    depends_on:
      - backend
    ports:
      - "5173:5173"
volumes:
  vernacular_pgdata: